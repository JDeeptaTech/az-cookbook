---
# Write the kubeconfig to a file. The user then works with:  oc --kubeconfig <file> ...
- name: Load the kubeconfig
  ansible.builtin.slurp:
    src: "{{ bg_tmp.path }}/kubeconfig"
  register: bg_kubeconfig
  no_log: true

- name: Set output path
  ansible.builtin.set_fact:
    bg_output_file: >-
      {{ breakglass_output_dir }}/{{ target_cluster }}-{{ breakglass_account }}-{{ breakglass_recipient }}.kubeconfig

- name: Create the output directory (0700)
  ansible.builtin.file:
    path: "{{ breakglass_output_dir }}"
    state: directory
    mode: "0700"

- name: Write the kubeconfig (0600)
  ansible.builtin.copy:
    dest: "{{ bg_output_file }}"
    content: "{{ bg_kubeconfig.content | b64decode }}"
    mode: "0600"
  no_log: true

- name: Record the issuance on the CertificateRequest (audit trail on the hub)
  kubernetes.core.k8s:
    state: patched
    api_version: cert-manager.io/v1
    kind: CertificateRequest
    name: "{{ bg_request_name }}"
    namespace: "{{ breakglass_request_namespace }}"
    definition:
      metadata:
        annotations:
          eos.breakglass/fingerprint-sha256: "{{ bg_fingerprint }}"
          eos.breakglass/expires: "{{ bg_not_after }}"

- name: How to use it
  ansible.builtin.debug:
    msg:
      - "Issued {{ breakglass_account }} on {{ target_cluster }} to {{ breakglass_recipient }} ({{ bg_username }})"
      - "Valid {{ bg_not_before }} to {{ bg_not_after }} UTC"
      - "File: {{ bg_output_file }}"
      - "Use:  oc --kubeconfig {{ bg_output_file }} whoami"
      - "  or: export KUBECONFIG={{ bg_output_file }}; oc get nodes"
      - "Do not run 'oc login' with it, and delete the file when you are done."
      - "Audit record: {{ breakglass_request_namespace }}/{{ bg_request_name }} on the hub"
