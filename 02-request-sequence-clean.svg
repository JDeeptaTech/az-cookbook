<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2E75B6"/></marker>
    <marker id="mN" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F3864"/></marker>
    <marker id="mG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#548235"/></marker>
    <marker id="mA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#BF8F00"/></marker>
    <marker id="mR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C00000"/></marker>
    <marker id="mK" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7F7F7F"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#FFFFFF"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#1F3864">Mirror Request — Sequence of Interactions</text>

  <!-- actors -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="45" y="55" width="150" height="42" rx="8" fill="#DEEBF7" stroke="#2E75B6" stroke-width="1.5"/><text x="120" y="81" fill="#1F3864">Requester</text>
    <rect x="240" y="55" width="150" height="42" rx="8" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5"/><text x="315" y="81" fill="#333">AAP Controller</text>
    <rect x="435" y="55" width="150" height="42" rx="8" fill="#2E75B6" stroke="#1F3864" stroke-width="1.5"/><text x="510" y="81" fill="#fff">Skyline store</text>
    <rect x="630" y="55" width="150" height="42" rx="8" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5"/><text x="705" y="81" fill="#7F5F00">Approver</text>
    <rect x="825" y="55" width="150" height="42" rx="8" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/><text x="900" y="81" fill="#7F1010">Mirror server</text>
    <rect x="1020" y="55" width="150" height="42" rx="8" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/><text x="1095" y="81" fill="#375623">Nexus</text>
  </g>
  <!-- lifelines -->
  <g stroke="#BFBFBF" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="120" y1="97" x2="120" y2="660"/><line x1="315" y1="97" x2="315" y2="660"/>
    <line x1="510" y1="97" x2="510" y2="660"/><line x1="705" y1="97" x2="705" y2="660"/>
    <line x1="900" y1="97" x2="900" y2="660"/><line x1="1095" y1="97" x2="1095" y2="660"/>
  </g>

  <!-- messages -->
  <g font-size="11">
    <line x1="120" y1="135" x2="311" y2="135" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#mB)"/>
    <text x="132" y="128" fill="#1F3864">1. launch mirror-request (survey: channel, target, arch, operators)</text>

    <line x1="315" y1="175" x2="506" y2="175" stroke="#1F3864" stroke-width="1.8" marker-end="url(#mN)"/>
    <text x="327" y="168" fill="#1F3864">2. query upgrade path + Nexus inventory</text>

    <line x1="510" y1="215" x2="319" y2="215" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mN)"/>
    <text x="330" y="208" fill="#1F3864">3. delta: releases missing in Nexus</text>

    <line x1="315" y1="255" x2="701" y2="255" stroke="#BF8F00" stroke-width="1.8" marker-end="url(#mA)"/>
    <text x="380" y="248" fill="#7F5F00">4. approval request incl. plan_delta (exact release list)</text>

    <line x1="705" y1="295" x2="319" y2="295" stroke="#548235" stroke-width="1.8" marker-end="url(#mG)"/>
    <text x="380" y="288" fill="#375623">5. approve</text>

    <line x1="315" y1="335" x2="896" y2="335" stroke="#548235" stroke-width="1.8" marker-end="url(#mG)"/>
    <text x="380" y="328" fill="#375623">6. render ImageSetConfiguration, run oc-mirror (delegate_to)</text>

    <!-- self message -->
    <polyline points="900,370 950,370 950,395 904,395" fill="none" stroke="#C00000" stroke-width="1.8" marker-end="url(#mR)"/>
    <rect x="960" y="358" width="185" height="44" rx="4" fill="#fff" stroke="#C00000" stroke-dasharray="3 3"/>
    <text x="1052" y="376" fill="#7F1010" text-anchor="middle">7. acquire run lock, load</text>
    <text x="1052" y="393" fill="#7F1010" text-anchor="middle">persistent workspace metadata</text>

    <line x1="900" y1="440" x2="1091" y2="440" stroke="#548235" stroke-width="1.8" marker-end="url(#mG)"/>
    <text x="912" y="433" fill="#375623">8. push release + operator images (m2m)</text>

    <line x1="1095" y1="478" x2="904" y2="478" stroke="#548235" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mG)"/>
    <text x="920" y="471" fill="#375623">9. digests confirmed</text>

    <line x1="900" y1="518" x2="319" y2="518" stroke="#7F7F7F" stroke-width="1.8" marker-end="url(#mK)"/>
    <text x="380" y="511" fill="#555">10. IDMS / ITMS / CatalogSource generated (to Git for GitOps)</text>

    <line x1="315" y1="558" x2="124" y2="558" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#mB)"/>
    <text x="140" y="551" fill="#1F3864">11. result summary (mirrored versions)</text>

    <line x1="315" y1="615" x2="506" y2="615" stroke="#7F7F7F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mK)"/>
    <text x="327" y="608" fill="#555">12. scheduled ingest refreshes inventory (closes the loop)</text>
  </g>

  <rect x="40" y="690" width="1130" height="70" rx="6" fill="#FAFAFA" stroke="#7F7F7F"/>
  <text x="55" y="712" font-size="11" font-weight="bold" fill="#1F3864">Notes</text>
  <text x="55" y="731" font-size="11" fill="#333">Solid arrows = requests, dashed = responses. Steps 6-10 are serialized: AAP job concurrency = 1 plus a host-level run lock.</text>
  <text x="55" y="749" font-size="11" fill="#333">The persistent oc-mirror workspace makes runs incremental; only releases absent from Nexus (step 3) are downloaded.</text>
</svg>
