apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-sync
  namespace: observability
spec:
  # Scale up to the partition count of the busiest topic; offsets live in Postgres,
  # so rebalances are safe. More replicas than partitions just sit idle.
  replicas: 2
  selector: { matchLabels: { app: vm-sync } }
  template:
    metadata: { labels: { app: vm-sync } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: vm-sync
          image: registry.example.com/platform/vm-sync:1.0.0
          env:
            - { name: KAFKA_BOOTSTRAP, value: "my-cluster-kafka-bootstrap.kafka.svc:9093" }
            - { name: KAFKA_SECURITY_PROTOCOL, value: SSL }
            - { name: KAFKA_CA, value: /certs/ca.crt }
            - { name: KAFKA_CERT, value: /certs/user.crt }
            - { name: KAFKA_KEY, value: /certs/user.key }
            - { name: KAFKA_GROUP, value: vm-sync }
            - { name: TOPIC_LOGS, value: eosvmaudit.logs.raw }
            - { name: TOPIC_METRICS, value: vm-metrics }
            - { name: PAYLOAD_ENCODING, value: otlp_json }
            - { name: DEFAULT_CLUSTER, value: ocp-prod-01 }
            - { name: PG_DSN, value: "host=vmtel-pg.db.svc port=5432 dbname=vmtel user=vm_sync sslmode=verify-full sslrootcert=/pg/ca.crt" }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: vm-sync-pg, key: password } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(cut -d. -f1 /tmp/vm-sync-alive) )) -lt 120"]
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: kafka-certs, mountPath: /certs, readOnly: true }
            - { name: pg-ca, mountPath: /pg, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: kafka-certs, secret: { secretName: vm-sync-kafka-user } }
        - { name: pg-ca, secret: { secretName: vmtel-pg-ca } }
        - { name: tmp, emptyDir: {} }
